<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <h1>Conversations</h1>
  </div>
  <div class="persona-list" id="persona-list">
    <!-- Injected by chat.js -->
  </div>
  <div class="sidebar-footer">All powered by Llama 3 · Groq</div>
</div>

<!-- BACKDROP (mobile overlay) -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- CHAT AREA -->
<div id="chat-area">

  <!-- Header -->
  <div id="chat-header">
    <button id="mobile-menu" onclick="toggleSidebar()" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="h-avatar" id="header-avatar"></div>
    <div>
      <div class="h-name" id="header-name"></div>
      <div class="h-status">● Online</div>
    </div>
    <div class="h-badge" id="header-badge"></div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Input -->
  <div id="chat-footer">
    <textarea id="msg-input" rows="1" placeholder="Message..."></textarea>
    <button id="send-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</div>

<script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
