<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='marked.min.js') }}"></script>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <div class="loader-content">
    <div class="loader-avatars">
      <div class="l-avatar" style="background:#f472b620">
        <svg width="32" height="32" viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="19" r="8" fill="#f472b6"/>
          <path d="M12 45c0-7.18 5.82-13 13-13s13 5.82 13 13" fill="#f472b6" opacity=".7"/>
        </svg>
      </div>
      <div class="l-avatar" style="background:#a78bfa20">
        <svg width="32" height="32" viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="19" r="8" fill="#a78bfa"/>
          <path d="M12 45c0-7.18 5.82-13 13-13s13 5.82 13 13" fill="#a78bfa" opacity=".7"/>
        </svg>
      </div>
      <div class="l-avatar" style="background:#60a5fa20">
        <svg width="32" height="32" viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="19" r="8" fill="#60a5fa"/>
          <path d="M12 45c0-7.18 5.82-13 13-13s13 5.82 13 13" fill="#60a5fa" opacity=".7"/>
        </svg>
      </div>
      <div class="l-avatar" style="background:#fb923c20">
        <svg width="32" height="32" viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="19" r="8" fill="#fb923c"/>
          <path d="M12 45c0-7.18 5.82-13 13-13s13 5.82 13 13" fill="#fb923c" opacity=".7"/>
        </svg>
      </div>
    </div>
    <div class="loader-title">AI Chat</div>
    <div class="loader-sub">Waking up your assistants...</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
</div>

<!-- BACKDROP -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <h1>Conversations</h1>
  </div>
  <div class="persona-list" id="persona-list"></div>
  <div class="sidebar-footer">All powered by Llama 3 · Groq</div>
</div>

<!-- CHAT AREA -->
<div id="chat-area">

  <!-- Header -->
  <div id="chat-header">
    <button id="logo-btn" onclick="toggleSidebar()" aria-label="Open conversations">
      <svg id="logo-svg" width="26" height="26" viewBox="0 0 50 50" fill="none">
        <circle cx="25" cy="25" r="25" fill="url(#lg)"/>
        <circle cx="25" cy="19" r="8" fill="#fff"/>
        <path d="M12 45c0-7.18 5.82-13 13-13s13 5.82 13 13" fill="#fff" opacity=".85"/>
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="50" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#f472b6"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
      </svg>
    </button>
    <div class="h-avatar" id="header-avatar"></div>
    <div class="h-info">
      <div class="h-name" id="header-name"></div>
      <div class="h-status">● Online</div>
    </div>
    <div class="h-badge" id="header-badge"></div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Input -->
  <div id="chat-footer">
    <textarea id="msg-input" rows="1" placeholder="Message..."></textarea>
    <button id="send-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</div>

<script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
