<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ══════════════════════════════════════
     SPLASH / LOADER
══════════════════════════════════════ -->
<div id="loader">
  <div class="loader-content">
    <div class="loader-avatars">
      <div class="l-avatar" style="background:#f472b620">🌸</div>
      <div class="l-avatar" style="background:#a78bfa20">⭐</div>
      <div class="l-avatar" style="background:#60a5fa20">💧</div>
      <div class="l-avatar" style="background:#fb923c20">🔥</div>
    </div>
    <div class="loader-title">AI ChatBot</div>
    <div class="loader-sub">Waking up your assistants...</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
</div>


<!-- ══════════════════════════════════════
     SIDEBAR
══════════════════════════════════════ -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>Conversations</h1>
    <button id="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
  </div>

  <div class="persona-list" id="persona-list">
    <!-- Injected by chat.js -->
  </div>

  <div class="sidebar-footer">All powered by Llama 3 · Groq</div>
</div>


<!-- ══════════════════════════════════════
     CHAT AREA
══════════════════════════════════════ -->
<div id="chat-area">
<!-- Header -->
<div id="chat-header">
  <button id="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="h-avatar" id="header-avatar"></div>
  <div>
    <div class="h-name" id="header-name"></div>
    <div class="h-status">● Online</div>
  </div>
  <div class="h-badge" id="header-badge"></div>
  <button id="voice-toggle-btn" aria-label="Toggle voice replies" title="Toggle voice replies">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>
</div>

<!-- Messages -->
<div id="messages"></div>

<!-- Input -->
<div id="chat-footer">
  <button id="mic-btn" aria-label="Voice input" title="Speak your message">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
  </button>
  <textarea id="msg-input" rows="1" placeholder="Message..."></textarea>
  <button id="send-btn" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M22 2L11 13" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>


<!-- ══════════════════════════════════════
     MOBILE PERSONA BOTTOM SHEET
══════════════════════════════════════ -->
<div id="persona-sheet">
  <div id="sheet-backdrop" onclick="closePersonaSheet()"></div>
  <div id="sheet-panel"></div>
</div>


<script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
